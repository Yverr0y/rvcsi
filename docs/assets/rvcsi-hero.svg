<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">rvCSI: edge RF sensing</title><desc id="desc">Animated radio waves illustrate CSI becoming validated events. Decorative waves are not measured data.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#10142b"/></linearGradient><linearGradient id="line"><stop stop-color="#46e8c1"/><stop offset="1" stop-color="#70a7ff"/></linearGradient></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#edf5ff}.muted{fill:#9aafc8}.label{font-size:14px;letter-spacing:2px;fill:#46e8c1}.flow{stroke-dasharray:7 12;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.wave{animation:pulse 3s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 5s ease-out infinite}@keyframes flow{to{stroke-dashoffset:-76}}@keyframes pulse{50%{opacity:.35}}@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.2);opacity:.08}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.wave,.ring{animation:none!important}}</style><rect width="960" height="360" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="958" height="358" rx="19" fill="none" stroke="#243854"/><path d="M0 0V360" stroke="#29425f" opacity=".17"/><path d="M40 0V360" stroke="#29425f" opacity=".17"/><path d="M80 0V360" stroke="#29425f" opacity=".17"/><path d="M120 0V360" stroke="#29425f" opacity=".17"/><path d="M160 0V360" stroke="#29425f" opacity=".17"/><path d="M200 0V360" stroke="#29425f" opacity=".17"/><path d="M240 0V360" stroke="#29425f" opacity=".17"/><path d="M280 0V360" stroke="#29425f" opacity=".17"/><path d="M320 0V360" stroke="#29425f" opacity=".17"/><path d="M360 0V360" stroke="#29425f" opacity=".17"/><path d="M400 0V360" stroke="#29425f" opacity=".17"/><path d="M440 0V360" stroke="#29425f" opacity=".17"/><path d="M480 0V360" stro