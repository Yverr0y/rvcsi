<svg xmlns="http://www.w3.org/2000/svg" width="960" height="338" viewBox="0 0 960 338" role="img" aria-labelledby="title desc"><title id="title">rvCSI RF memory workflow</title><desc id="desc">Windows and events become deterministic embeddings for similarity and baseline drift. Current stores are in-memory and JSONL; the production RuVector binding is pending.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#10142b"/></linearGradient><linearGradient id="line"><stop stop-color="#46e8c1"/><stop offset="1" stop-color="#70a7ff"/></linearGradient></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#edf5ff}.muted{fill:#9aafc8}.label{font-size:14px;letter-spacing:2px;fill:#46e8c1}.flow{stroke-dasharray:7 12;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.wave{animation:pulse 3s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 5s ease-out infinite}@keyframes flow{to{stroke-dashoffset:-76}}@keyframes pulse{50%{opacity:.35}}@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.2);opacity:.08}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.wave,.ring{animation:none!important}}</style><rect width="960" height="338" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="958" height="336" rx="19" fill="none" stroke="#243854"/><text x="32" y="40" font-size="14" class="label">RF MEMORY / REPRODUCIBLE BY DESIGN</text><text x="32" y="80" font-size="28" class="">Compare patterns. Track baseline drift.</text><rect x="32" y="111" width="280" height="122" rx="12" fill="#102235" stroke="#29425f"/><text x="50" y="142" font-size="14" class="label">WINDOWS + EVENTS</text><text x="50" y="180" font-size="21" class="">Temporal evidence</text><text x="50" y="211" font-size="15" class="muted">CsiWindow / CsiEvent</text><path class="flow" d="M312 172h28" stroke="#70a7ff" stroke-width="2"/><rect x="340" y="111" width="280" height="122" rx="12" fill="#102235" stroke="#29425f"/><text x="358" y="142" font-size="14" class="label">EMBEDDINGS</text><text x="358" y="180" font-size="21" class="">Deterministic vectors</text><text x="358" y="211" font-size="15" class="muted">Same input → same vector</text><path class="flow" d="M620 172h28" stroke="#70a7ff" stroke-width="2"/><rect x="648" y="111" width="280" height="122" rx="12" fill="#102235" stroke="#29425f"/><text x="666" y="142" font-size="14" class="label">RF MEMORY</text><text x="666" y="180" font-size="21" class="">Similarity + baseline</text><text x="666" y="211" font-size="15" class="muted">In-memory / JSONL</text><text x="32" y="279" font-size="16" class="">Available: deterministic embeddings, cosine similarity, JSONL persistence.</text><text x="32" y="310" font-size="14" class="muted">Production RuVector binding is pending. Illustration shows architecture, not measurements.</text></svg>
